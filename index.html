<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walentynki 💖</title>
<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #ffe6e6;
    padding: 20px 10px;
    overflow-x: hidden;
}

/* HASŁO */
#passwordOverlay {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(255,230,230,0.98);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:2000;
}
#passwordOverlay input {
    padding: 12px;
    font-size: 18px;
    border-radius: 10px;
    border: 2px solid #ff4d6d;
    margin-bottom: 10px;
}
#passwordOverlay button {
    padding: 10px 20px;
    font-size: 16px;
    background:#ff4d6d;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

/* SERDUSZKA */
.hearts {
    position: relative;
    width: 100%;
    height: 120px;
    overflow: hidden;
}
.heart {
    position: absolute;
    bottom: -40px;
    width: 20px;
    height: 20px;
    background-color: #ff4d6d;
    transform: rotate(-45deg);
    animation: floatUp linear infinite;
}
.heart:before, .heart:after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background-color: #ff4d6d;
    border-radius: 50%;
}
.heart:before { top: -10px; left: 0; }
.heart:after { left: 10px; top: 0; }
@keyframes floatUp { to { transform: translateY(-220px) rotate(-45deg); opacity: 0; } }

h1 { font-size: 26px; margin: 10px 0; }
p { font-size: 18px; }

/* BUTTONY */
.question-container { margin-top: 20px; position: relative; }
button {
    padding: 14px 20px;
    margin: 10px;
    font-size: 16px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    transition: transform 0.3s ease;
}
.yes-btn { background: #ff4d6d; color: white; display: block; margin-left:auto; margin-right:auto; }
.no-btn { background: #ccc; }

/* NIESPODZIANKI */
.surprises { display: none; }

/* PREZENT */
.gift {
    width: 100px;
    height: 100px;
    margin: 30px auto;
    background: #ff4d6d;
    position: relative;
    animation: shake 1s infinite;
}
.gift::before, .gift::after { content: ""; position: absolute; background: white; }
.gift::before { width: 100%; height: 16px; top: 42px; }
.gift::after { width: 16px; height: 100%; left: 42px; }
@keyframes shake {
    0%,100% { transform: rotate(0); }
    25% { transform: rotate(2deg); }
    50% { transform: rotate(-2deg); }
}
.open { transform: scale(0); opacity: 0; transition: 1s; }

/* TEKST KOŃCOWY */
.final-text { font-size: 20px; color: #ff4d6d; padding: 10px; }

/* ODLICZANIE */
.countdown { font-size: 22px; color: #ff4d6d; margin-top: 15px; }

/* KONFETTI */
.confetti {
    position: fixed;
    width: 8px;
    height: 8px;
    top: -10px;
    animation: fall linear forwards;
}
@keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }

/* PODPOWIEDŹ */
.hint-overlay {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(255,230,230,0.95);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-size:20px;
    z-index:1000;
}
.hint-bar {
    width:80%;
    height:10px;
    background:#ccc;
    margin-top:20px;
    border-radius:5px;
    overflow:hidden;
}
.hint-progress {
    width:0%;
    height:100%;
    background:#ff4d6d;
    animation: progress 5s linear forwards;
}
@keyframes progress { to { width:100%; } }

/* IKONA APARATU */
.camera-icon {
    font-size:60px;
    animation: pulse 1s infinite alternate;
}
@keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.3); } }

</style>
</head>

<body>

<!-- EKRAN HASŁA -->
<div id="passwordOverlay">
    <h2>Wpisz hasło, aby rozpocząć 💖</h2>
    <input type="password" id="passwordInput" placeholder="Hasło">
    <button id="passwordBtn">Potwierdź</button>
    <p id="passwordMsg" style="color:red; display:none;">❌ Niepoprawne hasło</p>
</div>

<div class="hearts" id="heartsTop"></div>

<h1>💖 Walentynki 💖</h1>

<div class="question-container" id="questionBox">
    <p>Czy zostaniesz moją walentynką?</p>
    <button class="yes-btn" id="yesBtn">Tak</button>
    <button class="no-btn" id="noBtn">Nie</button>
</div>

<div class="surprises" id="surprises">
    <h2>Wybierz niespodziankę 🎁</h2>
    <button class="surprise-btn" id="surprise1">🎁 Niespodzianka 1</button>
    <button class="surprise-btn" id="surprise2">🎁 Niespodzianka 2</button>
</div>

<div id="giftContainer"></div>

<div class="hearts" id="heartsBottom"></div>

<script>
let scale=1,noClick=0,noOffset=0;
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const surprises=document.getElementById("surprises");
const giftContainer=document.getElementById("giftContainer");

const noTexts=[
    "Nie tak łatwo 💖","Oj nie 😏","Jeszcze raz 😘","Prawie!","Nie uciekniesz 😍","Spróbuj ponownie 💘"
];

/* HASŁO */
const passwordOverlay=document.getElementById("passwordOverlay");
const passwordInput=document.getElementById("passwordInput");
const passwordBtn=document.getElementById("passwordBtn");
const passwordMsg=document.getElementById("passwordMsg");

passwordBtn.addEventListener("click",()=>{
    if(passwordInput.value === "Marta"){
        passwordOverlay.style.display="none";
    } else {
        passwordMsg.style.display="block";
    }
});
passwordInput.addEventListener("keyup",(e)=>{
    if(e.key==="Enter"){
        passwordBtn.click();
    }
});

/* NIE */
noBtn.addEventListener("click",()=>{
    noClick++;
    scale+=0.3;
    yesBtn.style.transform=`scale(${scale})`;
    noBtn.textContent=noTexts[Math.min(noClick,noTexts.length-1)];
    noOffset+=50;
    noBtn.style.transform=`translateX(${noOffset}px)`;
    if(noOffset>window.innerWidth) noBtn.style.display="none";
});

/* TAK */
yesBtn.addEventListener("click",()=>{
    document.getElementById("questionBox").style.display="none";
    surprises.style.display="block";
});

/* PODPOWIEDŹ */
function createHint(showContent,callback){
    const overlay=document.createElement("div");
    overlay.className="hint-overlay";
    showContent(overlay);
    const bar=document.createElement("div");
    bar.className="hint-bar";
    const progress=document.createElement("div");
    progress.className="hint-progress";
    bar.appendChild(progress);
    overlay.appendChild(bar);
    document.body.appendChild(overlay);
    setTimeout(()=>{
        overlay.remove();
        callback();
    },5000);
}

/* FUNKCJA ROMANTYCZNY FINALS */
function romanticFinal(){
    giftContainer.innerHTML=`
        <div class="final-text" style="font-size:24px;">💖 Hurra! Niech ten dzień będzie magiczny! 💖</div>
    `;
    confetti();
}

/* NIESPODZIANKA 1 */
const surprise1=document.getElementById("surprise1");
surprise1.addEventListener("click",()=>{
    surprises.style.display="none";
    if(navigator.vibrate) navigator.vibrate([200,100,200]);

    giftContainer.innerHTML=`
        <div class="final-text">Super to mamy wybrane! 💖</div>
        <button class="surprise-btn" id="hintBtn">Czy chcesz podpowiedź?</button>
    `;
    
    document.getElementById("hintBtn").addEventListener("click",()=>{
        createHint((overlay)=>{
            const camera=document.createElement("div");
            camera.className="camera-icon";
            camera.textContent="📸";
            overlay.appendChild(camera);
        },()=>{
            giftContainer.innerHTML=`
                <div class="final-text">💖 Super! Jesteśmy umówieni 😘💖</div>
                <button class="surprise-btn" id="acceptBtn">Akceptuj zaproszenie 💌</button>
                <button class="surprise-btn" id="back1">Możesz też dobrać drugą niespodziankę ;)</button>
                <div class="countdown" id="countdown"></div>
            `;
            startCountdown();

            document.getElementById("acceptBtn").addEventListener("click", romanticFinal);

            document.getElementById("back1").addEventListener("click",()=>{
                giftContainer.innerHTML="";
                surprises.style.display="block";
            });
        });
    });
});

/* NIESPODZIANKA 2 */
const surprise2=document.getElementById("surprise2");
surprise2.addEventListener("click",()=>{
    surprises.style.display="none";
    if(navigator.vibrate) navigator.vibrate([200,100,200]);

    createHint((overlay)=>{
        overlay.innerHTML+="<div>📍 Ładowanie podpowiedzi...</div>";
    },()=>{
        giftContainer.innerHTML=`
            <div class="final-text">💖 Super! Jesteśmy umówieni 😘💖</div>
            <div style="margin:20px auto; width:90%; max-width:500px; height:300px;">
                <iframe
                    width="100%"
                    height="100%"
                    style="border:0"
                    loading="lazy"
                    allowfullscreen
                    referrerpolicy="no-referrer-when-downgrade"
                    src="https://www.google.com/maps?q=50.398462,18.913361&hl=pl&z=15&output=embed">
                </iframe>
            </div>
            <button class="surprise-btn" id="acceptBtn2">Akceptuj zaproszenie 💌</button>
            <button class="surprise-btn" id="back2">Możesz też dobrać drugą niespodziankę ;)</button>
            <div class="countdown" id="countdown"></div>
        `;
        startCountdown();

        document.getElementById("acceptBtn2").addEventListener("click", romanticFinal);

        document.getElementById("back2").addEventListener("click",()=>{
            giftContainer.innerHTML="";
            surprises.style.display="block";
        });
    });
});

/* ODLICZANIE */
function startCountdown(){
    const valentine=new Date(new Date().getFullYear(),1,14);
    setInterval(()=>{
        const now=new Date();
        const diff=valentine-now;
        if(diff<=0){ document.getElementById("countdown").textContent="💘 To dziś! 💘"; return; }
        const d=Math.floor(diff/(1000*60*60*24));
        const h=Math.floor(diff/(1000*60*60)%24);
        const m=Math.floor(diff/(1000*60)%60);
        const s=Math.floor(diff/1000%60);
        document.getElementById("countdown").textContent=`${d} dni ${h}h ${m}m ${s}s`;
    },1000);
}

/* SERDUSZKA */
function heartsLoop(id){
    setInterval(()=>{
        const h=document.createElement("div");
        h.className="heart";
        h.style.left=Math.random()*window.innerWidth+"px";
        h.style.animationDuration=(Math.random()*3+2)+"s";
        document.getElementById(id).appendChild(h);
        setTimeout(()=>h.remove(),5000);
    },250);
}
heartsLoop("heartsTop");
heartsLoop("heartsBottom");

/* KONFETTI */
function confetti(){
    for(let i=0;i<100;i++){
        const c=document.createElement("div");
        c.className="confetti";
        c.style.left=Math.random()*window.innerWidth+"px";
        c.style.background=`hsl(${Math.random()*360},100%,50%)`;
        c.style.animationDuration=(Math.random()*3+2)+"s";
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),5000);
    }
}
</script>

</body>
</html>
